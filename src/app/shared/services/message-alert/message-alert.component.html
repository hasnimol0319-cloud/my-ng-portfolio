<div class="alert-stack">
    @for (alert of (alertService.alerts$ | async); track alert.id) {
        <div class="alert" [class]="alert.type">

            <div class="icon" style="display: flex; align-items: center; justify-content: center;">
                @switch (alert.type) {
                    @case ('success') {
                        <i class="pi pi-check-circle" style="font-size: 1.25rem;"></i>
                    }
                    @case ('error') {
                        <i class="pi pi-exclamation-circle" style="font-size: 1.25rem;"></i>
                    }
                    @default {
                        <i class="pi pi-info-circle" style="font-size: 1.25rem;"></i>
                    }
                }
            </div>

            <p>{{ alert.text }}</p>

            <button type="button" class="close" (click)="dismiss(alert.id)" aria-label="Dismiss">
                <i class="pi pi-times"></i>
            </button>


        </div>
    }
</div>

<section class="experience">
    <div class="section-head animation-fade-in-top">
        <h2>My Experience</h2>
        <p class="description">A timeline of my professional journey and career highlights.</p>
    </div>

    <div class="timeline-wrap">
        <p-timeline [value]="experiences" align="alternate">
            <ng-template pTemplate="marker" let-item>
                <div class="marker-icon" [style.background]="item.color">
                    <i [class]="getIconClass(item.icon)" style="color: #ffffff; font-size: 1.15rem;"></i>
                </div>
            </ng-template>
            <ng-template pTemplate="content" let-item let-i="index">
                <div class="card" [class]="i % 2 === 0 ? 'animation-fade-in-right' : 'animation-fade-in-left'">
                    <h3>{{ item.role }}</h3>
                    <span class="period">{{ item.period }}</span>
                    <p class="description">{{ item.description }}</p>

                    <div class="divider"></div>

                    <div class="tags flex flex-wrap gap-2">
                        @for (tag of item.tags; track tag) {
                            <p-tag [value]="tag" [rounded]="true"></p-tag>
                        }
                    </div>

                </div>
            </ng-template>
        </p-timeline>
    </div>
</section>

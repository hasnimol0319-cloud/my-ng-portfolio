<div class="feature-frame">

    <svg width="0" height="0" class="clip-defs">
        <defs>
            <clipPath id="chamferClip" clipPathUnits="objectBoundingBox">
                <path d="M0.18,0 L0.92,0 Q1,0 1,0.08 L1,0.82 L0.82,1 L0.08,1 Q0,1 0,0.92 L0,0.18 Z"></path>
            </clipPath>
        </defs>
    </svg>

    <img class="feature-photo" [src]="imageSrc" [alt]="alt">

    <svg class="border-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
            <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7dd3fc"></stop>
                <stop offset="100%" stop-color="var(--primary,#2563eb)"></stop>
            </linearGradient>
        </defs>

        <path class="track"
            d="M18,0 L92,0 Q100,0 100,8 L100,82 L82,100 L8,100 Q0,100 0,92 L0,18 Z"
            pathLength="100" fill="none"
            stroke="rgba(255,255,255,.1)" stroke-width="1.5"></path>

        <path class="chaser"
            d="M18,0 L92,0 Q100,0 100,8 L100,82 L82,100 L8,100 Q0,100 0,92 L0,18 Z"
            pathLength="100" fill="none"
            stroke="url(#borderGradient)" stroke-width="2.5"
            stroke-linecap="round" stroke-dasharray="35 65"></path>
    </svg>

</div>

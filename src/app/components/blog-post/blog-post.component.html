<section class="blog-post">
    <div class="post-card">

        <a routerLink="/articles" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Articles
        </a>

        @if (loading) {
            <div class="state loading">
                <span class="spinner"></span>
                <p>Loading article...</p>
            </div>
        }

        @if (loadFailed) {
            <div class="state error">
                <p>Couldn't load this article. Please try again later.</p>
            </div>
        }

        <article class="markdown-body" [class.hidden]="loading || loadFailed">
            @if (src) {
                <markdown [src]="src" (load)="onLoad()" (error)="onError()"></markdown>
            }
        </article>

    </div>
</section>

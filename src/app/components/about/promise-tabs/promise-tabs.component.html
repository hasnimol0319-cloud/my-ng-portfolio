
<div class="jurney">
  <h3>My approach</h3>
  <p class="description">
  Three principles guide every project I take on, from a single component to a full architecture rebuild.
  </p>
</div>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Company info tabs">
    <div
      class="tab-indicator"
      [style.width.px]="indicatorWidth"
      [style.transform]="'translateX(' + indicatorX + 'px)'">
    </div>

    <button
      *ngFor="let tab of tabs; let i = index"
      #tabBtn
      class="tab-btn"
      [class.active]="i === activeIndex"
      role="tab"
      [attr.aria-selected]="i === activeIndex"
      [attr.aria-controls]="'panel-' + tab.id"
      (click)="selectTab(i)">
      {{ tab.label }}
    </button>
  </div>

  <div
    class="panel"
    *ngFor="let tab of tabs; let i = index"
    [id]="'panel-' + tab.id"
    role="tabpanel"
    [class.active]="i === activeIndex"
    [class.enter]="i === activeIndex && replayAnimation">


    <img class="panel-img" [src]="tab.image" alt="" srcset="">
    <div class="panel-text">
      <h4>{{ tab.heading }}</h4>
      <p class="description">{{ tab.description }}</p>
    </div>

  </div>

</div>

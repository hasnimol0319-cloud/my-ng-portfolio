<header class="navbar">
    <div class="container">

        <a routerLink="/" class="logo">
            Dev<span>Has</span>
        </a>
        <div class="actions-wrap">
            <button type="button" class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="'Switch to ' + (themeService.currentTheme() === 'dark' ? 'light' : 'dark') + ' theme'">
                @if (themeService.currentTheme() === 'dark') {
                <i class="fa-solid fa-sun icon-sun"></i>
                } @else {
                <i class="fa-solid fa-moon icon-moon"></i>
                }
            </button>
            <div class="actions-sm">
                <a routerLink="/contact" class="btn-cin"><i class="fa-solid fa-message"></i></a>
            </div>
            <button type="button" class="hamburger" [class.is-open]="isMenuOpen" (click)="toggleMenu()"
                aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <nav class="nav-links" [class.is-open]="isMenuOpen">
            @for (m of menu; track m.id) {
            <a [routerLink]="m.url" routerLinkActive="active" (click)="closeMenu()">{{m.name}}</a>
            }
        </nav>

        <div class="actions">
            <button type="button" class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="'Switch to ' + (themeService.currentTheme() === 'dark' ? 'light' : 'dark') + ' theme'">
                @if (themeService.currentTheme() === 'dark') {
                <i class="fa-solid fa-sun icon-sun"></i>
                } @else {
                <i class="fa-solid fa-moon icon-moon"></i>
                }
            </button>
            <a routerLink="/contact" class="btn">Message</a>
        </div>
    </div>
</header>

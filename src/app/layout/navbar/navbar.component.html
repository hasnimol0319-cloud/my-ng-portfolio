<header class="navbar">
    <div class="container">

        <a routerLink="/" class="logo">
            Dev<span>Has</span>
        </a>

        <button type="button" class="hamburger" [class.is-open]="isMenuOpen" (click)="toggleMenu()" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" [class.is-open]="isMenuOpen">
            @for (m of menu; track m.id) {
                <a [routerLink]="m.url" routerLinkActive="active" (click)="closeMenu()">{{m.name}}</a>
            }
        </nav>

        <div class="actions">
            <a href="#" class="btn">Hire Me</a>
        </div>
    </div>
</header>
